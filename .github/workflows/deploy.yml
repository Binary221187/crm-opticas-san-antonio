name: Deploy CRM to Cloudflare

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (pnpm)
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies
        run: pnpm install

      - name: Build with CI script
        id: build
        run: |
          node scripts/ci-build.mjs 2>&1 | tee build.log || true
          echo "---BUILD OUTPUT---"
          cat build.log || echo "no build.log"

      - name: Verify build output
        run: ls -la dist/server/wrangler.json 2>/dev/null || echo "dist/server/wrangler.json not found"

      - name: Deploy to Cloudflare
        if: steps.build.outcome == 'success'
        run: npx wrangler deploy dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
